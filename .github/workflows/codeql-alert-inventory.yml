# Recheck open alerts following URL validation changes.
name: CodeQL Alert Inventory (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql-alert-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Read open CodeQL alerts (no credentials in logs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate --method GET -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            | jq -s '[.[][] | {
                number,
                state,
                rule_id: .rule.id,
                severity: .rule.severity,
                security_severity: .rule.security_severity_level,
                description: .rule.description,
                tool: .tool.name,
                path: .most_recent_instance.location.path,
                start_line: .most_recent_instance.location.start_line,
                end_line: .most_recent_instance.location.end_line,
                message: .most_recent_instance.message.text
              }]'
