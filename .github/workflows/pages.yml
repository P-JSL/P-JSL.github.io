name: Publish My Video App Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '_config.yml'
      - 'downloads/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/prepare_download.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Publish latest extension ZIP
        run: python3 .github/scripts/prepare_download.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
