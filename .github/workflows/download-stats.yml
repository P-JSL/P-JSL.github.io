name: Collect Download Statistics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-stats.yml'
      - '.github/scripts/collect_download_stats.py'
  schedule:
    # Once per day at approximately 11:17 Asia/Seoul (02:17 UTC).
    # GitHub scheduled workflows may start later than the scheduled time.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: download-statistics-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public GitHub Release asset download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/collect_download_stats.py
      - name: Commit snapshot if changed
        id: snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/download-stats.json downloads/download-counts.json
          if git diff --staged --quiet; then
            echo "Statistics unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update periodic GitHub Release download statistics"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish updated statistics to Pages
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
