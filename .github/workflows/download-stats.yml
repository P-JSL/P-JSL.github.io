name: Collect Download Statistics

on:
  schedule:
    # Daily at 11:15 Korea time (02:15 UTC).
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-statistics-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public GitHub Release asset download counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/collect_download_stats.py
      - name: Commit snapshot if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/download-stats.json
          if git diff --staged --quiet; then
            echo "Statistics unchanged"
            exit 0
          fi
          git commit -m "Record daily release-download statistics"
          git push origin HEAD:main
